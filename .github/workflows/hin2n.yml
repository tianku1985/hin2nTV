# hin2n 组网 App 独立构建
# 与 TVBox 主程序（test.yml）解耦，支持手动触发（workflow_dispatch）或 hin2n/** 代码变更时自动构建。
# 构建产物：固定名 hin2n-latest.apk（tvbox 内置 json 的 hin2n.apkUrl 指向此文件）。

name: hin2n

on:
  push:
    branches: [main]
    paths: ['hin2n/**', '.github/workflows/hin2n.yml']
  workflow_dispatch:
    inputs:
      donotpublish:
        description: '构建后不发布'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Tag
        run: |
          echo "tag=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Release Apk Sign
        run: |
          # hin2n/Hin2n_android/app/build.gradle 已自带条件签名逻辑：
          #   project.hasProperty('RELEASE_STORE_FILE') 时创建 signingConfigs.release
          #   并在 release buildType 上挂载，无需（也不能）再向 build.gradle 注入代码——
          #   注入锚点 /release {/ 会同时命中 signingConfigs.release 与 buildTypes.release
          #   两处，把 signingConfig(...) 追加进 SigningConfig 块内部，
          #   导致项目评估失败（Could not find method signingConfig()）。
          # 这里只需准备签名材料：
          #   1) jks 拷贝到模块目录（build.gradle 里 file('./TVBoxOSC.jks') 相对模块目录解析）
          #   2) 向 Gradle 工程根 hin2n/Hin2n_android/gradle.properties 追加签名属性
          #      （本仓库根目录不是 Gradle 工程根，gradlew/settings.gradle/gradle.properties 都在 hin2n/Hin2n_android 下）
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks hin2n/Hin2n_android/app/TVBoxOSC.jks
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     hin2n/Hin2n_android/gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            hin2n/Hin2n_android/gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       hin2n/Hin2n_android/gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         hin2n/Hin2n_android/gradle.properties

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 工程固定 Gradle 6.3 + AGP 4.0.0，Gradle 6.x 最高支持 Java 13，用 17 会直接失败
          java-version: 11

      - name: Install NDK and CMake
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build hin2n with Gradle
        # Gradle 工程根是 hin2n/Hin2n_android（settings.gradle 只 include ':app'）
        working-directory: hin2n/Hin2n_android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease --build-cache --parallel --daemon --warning-mode all 2>&1 | tee gradle.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===== 编译错误行（error: / e: ）====="
            grep -nE "error:|^e: |Execution failed for task" gradle.log | tail -n 60 || true
            exit "$rc"
          fi

      - name: Prepare hin2n APK
        run: |
          rm -rf hin2n_apk/
          mkdir -p hin2n_apk/
          APK=hin2n/Hin2n_android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "未找到产物：$APK"
            find hin2n/Hin2n_android/app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" "hin2n_apk/hin2n_${{ env.tag }}.apk"
          # 固定名副本（供 tvbox 内置 json 的 hin2n.apkUrl 永远指向此文件）
          cp -f "hin2n_apk/hin2n_${{ env.tag }}.apk" hin2n_apk/hin2n-latest.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: hin2n
          path: hin2n_apk/*.apk

      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish }}
        run: |
          echo "skip publish"
          echo "tag=" >> $GITHUB_ENV

      - name: Release hin2n
        uses: ncipollo/release-action@v1
        if: ${{ env.tag }}
        with:
          name: hin2n-latest
          tag: hin2n-latest
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            hin2n_apk/*.apk
