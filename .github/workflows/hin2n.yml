# hin2n 组网 App 独立构建
# 与 TVBox 主程序（test.yml）解耦，支持手动触发（workflow_dispatch）或 hin2n/** 代码变更时自动构建。
# 构建产物：固定名 hin2n-latest.apk（tvbox 内置 json 的 hin2n.apkUrl 指向此文件）。

name: hin2n

on:
  push:
    branches: [main]
    paths: ['hin2n/**', '.github/workflows/hin2n.yml']
  workflow_dispatch:
    inputs:
      donotpublish:
        description: '构建后不发布'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Tag
        id: tag
        run: |
          echo "name=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Release Apk Sign
        run: |
          # hin2n/Hin2n_android/app/build.gradle 已自带条件签名逻辑：
          #   project.hasProperty('RELEASE_STORE_FILE') 时创建 signingConfigs.release
          #   并在 release buildType 上挂载，无需（也不能）再向 build.gradle 注入代码——
          #   注入锚点 /release {/ 会同时命中 signingConfigs.release 与 buildTypes.release
          #   两处，把 signingConfig(...) 追加进 SigningConfig 块内部，
          #   导致项目评估失败（Could not find method signingConfig()）。
          # 这里只需准备签名材料：
          #   1) jks 拷贝到模块目录（build.gradle 里 file('./TVBoxOSC.jks') 相对模块目录解析）
          #   2) 向 Gradle 工程根 hin2n/Hin2n_android/gradle.properties 追加签名属性
          #      （本仓库根目录不是 Gradle 工程根，gradlew/settings.gradle/gradle.properties 都在 hin2n/Hin2n_android 下）
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks hin2n/Hin2n_android/app/TVBoxOSC.jks
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     hin2n/Hin2n_android/gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            hin2n/Hin2n_android/gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       hin2n/Hin2n_android/gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         hin2n/Hin2n_android/gradle.properties

      # 工具链：Gradle 8.7 + AGP 8.2.2 均要求 JDK 17；cmdline-tools（sdkmanager）也由 Java 17 编译，
      # 因此全程单一 JDK 17（最后一次 setup-java 决定后续步骤的 JAVA_HOME）。
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK, CMake and Android platform
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;25.2.9519653" "cmake;3.22.1" \
            "platforms;android-34" "build-tools;34.0.0"

      # 仓库预置的 libcrypto.so 用高 API level 编译（引用 getentropy 等新符号 + DF_1_NOW），
      # 在 Android 9 及以下设备（多为 32 位盒子）上 dlopen 直接失败，
      # 导致 edge_v2/edge_v3/edge_jni 抛 UnsatisfiedLinkError。
      # 这里用 minSdk 对应的 API（32 位 19 / 64 位 21）重建后覆盖 jniLibs。
      - name: Cache OpenSSL build
        # 只在成功后的 post 步骤保存：早期版本 job 失败时也保存了残缺/半成品 libcrypto.so，
        # 被后续运行当作“可用缓存”复用，导致 APK 里的 libcrypto 缺符号、老设备 dlopen 失败。
        uses: actions/cache@v4
        with:
          path: hin2n/.openssl-build/out
          key: openssl-1.1.1w-api19-21-ndk25.2-${{ runner.os }}-v4

      - name: Rebuild libcrypto.so with low Android API
        run: |
          # 脚本内部优先选择 $ANDROID_SDK_ROOT/ndk/25.2.9519653（上方 sdkmanager 已安装），
          # 忽略 runner 镜像预装的最新版 NDK（其默认 API 为 35，产物在老设备上无法加载）。
          # 脚本还会去掉 OpenSSL 的 pthread_atfork 调用（__register_atfork / pthread_atfork
          # 在不同 Android 版本上分别缺失，是老设备 dlopen 失败的主因）。
          bash hin2n/scripts/build-openssl-android.sh

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build hin2n with Gradle
        # Gradle 工程根是 hin2n/Hin2n_android（settings.gradle 只 include ':app'）
        working-directory: hin2n/Hin2n_android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease --build-cache --parallel --daemon --warning-mode all 2>&1 | tee gradle.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===== 编译错误行（error: / e: ）====="
            grep -nE "error:|^e: |Execution failed for task" gradle.log | tail -n 60 || true
            exit "$rc"
          fi

      - name: Prepare hin2n APK
        run: |
          rm -rf hin2n_apk/
          mkdir -p hin2n_apk/
          APK=hin2n/Hin2n_android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "未找到产物：$APK"
            find hin2n/Hin2n_android/app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" "hin2n_apk/hin2n_${{ steps.tag.outputs.name }}.apk"
          # 固定名副本（供 tvbox 内置 json 的 hin2n.apkUrl 永远指向此文件）
          cp -f "hin2n_apk/hin2n_${{ steps.tag.outputs.name }}.apk" hin2n_apk/hin2n-latest.apk
          # 端到端兜底：确认打进 APK 的 libcrypto.so 已是低 API 且符号齐全的版本，
          # 且 APK 内所有 native 库都没有引用老系统 libc 里不存在的符号
          #（否则老设备仍会因 dlopen 失败报 UnsatisfiedLinkError）
          NDK_BIN="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          rm -rf /tmp/apklibs && mkdir -p /tmp/apklibs
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -p "$APK" "lib/$ABI/libcrypto.so" > "/tmp/apklibs/$ABI-libcrypto.so" || true
            if [ ! -s "/tmp/apklibs/$ABI-libcrypto.so" ]; then
              echo "APK 内缺少 lib/$ABI/libcrypto.so"; exit 1
            fi
            bash hin2n/scripts/check-libcrypto.sh "/tmp/apklibs/$ABI-libcrypto.so" \
              "$NDK_BIN/llvm-nm" "$NDK_BIN/llvm-readelf" \
              || { echo "APK 内 $ABI/libcrypto.so 校验失败"; exit 1; }
          done
          # 使用 OpenSSL 的库只检查“危险未定义符号”（它们不提供 EVP_* 等导出符号）
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            for LIB in edge_v2 edge_v3 edge_jni; do
              unzip -p "$APK" "lib/$ABI/$LIB.so" > "/tmp/apklibs/$ABI-$LIB.so" || true
              if [ -s "/tmp/apklibs/$ABI-$LIB.so" ]; then
                CHECK_MODE=undef bash hin2n/scripts/check-libcrypto.sh "/tmp/apklibs/$ABI-$LIB.so" \
                  "$NDK_BIN/llvm-nm" "$NDK_BIN/llvm-readelf" \
                  || { echo "APK 内 $ABI/$LIB.so 校验失败"; exit 1; }
              fi
            done
          done
          echo "APK 内 native 库符号校验通过（可用于老设备）"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: hin2n
          path: hin2n_apk/*.apk

      # 注意：不能用 ${{ env.tag }} 做 if 守卫——GITHUB_ENV 写入的值在 job 开始后
      # 才可见，而步骤 if 条件在 job 开始时求值，导致 Release 恒被跳过。
      # 故仅以 job 开始时即已知的 inputs.donotpublish 控制是否发布。
      - name: Release hin2n
        uses: ncipollo/release-action@v1
        if: ${{ !inputs.donotpublish }}
        with:
          name: hin2n-latest
          tag: hin2n-latest
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            hin2n_apk/*.apk

