// Top-level build file where you can add configuration options common to all sub-projects/modules.
// AGP 8.2.2 由 app/build.gradle 的 plugins {} DSL 声明（settings.gradle pluginManagement 解析），
// 此处不再维护 buildscript classpath；greenDAO 插件已移除——生成类（DaoSession/DaoMaster 等）已提交进源码，构建期无需代码生成。

allprojects {
    repositories {
        // jcenter 已永久关停（2022），老依赖走阿里云 jcenter 镜像
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
